name: Advanced CI Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  APP_NAME: Secured Auth API
  APP_ENV: test

  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/secured_auth_test_db

  ACCESS_TOKEN_SECRET: github-actions-access-secret-key
  REFRESH_TOKEN_SECRET: github-actions-refresh-secret-key

  JWT_ALGORITHM: HS256

  ACCESS_TOKEN_EXPIRE_MINUTES: 15
  REFRESH_TOKEN_EXPIRE_DAYS: 7

  REDIS_URL: redis://localhost:6379/0

jobs:

  lint:
    name: Ruff Linting
    runs-on: ubuntu-latest
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Check
        run: |
          ruff check .

      - name: Run Ruff Format Check
        run: |
          ruff format --check .

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    # Security scans can be noisy; don't block the pipeline on failures.
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run Bandit Security Scan
        run: |
          bandit -r app

      - name: Run Dependency Vulnerability Scan
        run: |
          pip-audit

  tests:
    name: Async Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    services:

      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: secured_auth_test_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d secured_auth_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7

        ports:
          - 6379:6379

        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Create Database Tables
        run: |
          python create_tables.py

      - name: Run Async Tests With Coverage
        run: |
          pytest --cov=app --cov-report=term-missing

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    # Docker build validation is optional for quick pipelines.
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Build Docker Image
        run: |
          docker build -t secured-auth .
